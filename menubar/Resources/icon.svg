<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <!-- monitor panel: dark screen with CPU / GPU / RAM meter columns -->
  <rect x="220" y="236" width="584" height="512" rx="70" fill="url(#box)" stroke="#ffffff" stroke-width="8"/>
  <rect x="260" y="276" width="504" height="340" rx="40" fill="#0f172a"/>
  <g>
    <rect x="320" y="316" width="96" height="260" rx="20" fill="#1e293b"/>
    <rect x="464" y="316" width="96" height="260" rx="20" fill="#1e293b"/>
    <rect x="608" y="316" width="96" height="260" rx="20" fill="#1e293b"/>
    <rect x="320" y="420" width="96" height="156" rx="20" fill="#38bdf8"/>
    <rect x="464" y="346" width="96" height="230" rx="20" fill="#a3e635"/>
    <rect x="608" y="460" width="96" height="116" rx="20" fill="#facc15"/>
  </g>
  <!-- tailnet devices, colored by status: live, live, no agent, offline -->
  <circle cx="404" cy="682" r="20" fill="#22c55e"/>
  <circle cx="476" cy="682" r="20" fill="#22c55e"/>
  <circle cx="548" cy="682" r="20" fill="#fb923c"/>
  <circle cx="620" cy="682" r="20" fill="#94a3b8"/>
</svg>
